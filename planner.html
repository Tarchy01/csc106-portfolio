<main id="main">

<div class="wrap page-title"><h1>Academic planner</h1><p>Add tasks, tick them off and delete them. Your list is saved in this browser.</p></div>
<section style="padding-top:1rem"><div class="wrap">
<form id="task-form" class="card planner-form" novalidate>
<div><label for="task-title">Task</label><input id="task-title" name="title" type="text" placeholder="e.g. Finish CSC 106 project" required></div>
<div><label for="task-course">Course</label><input id="task-course" type="text" placeholder="CSC 106"></div>
<div><label for="task-due">Due date</label><input id="task-due" type="date"></div>
<button class="btn" type="submit">Add task</button>
</form>
<p class="error" id="task-error" role="alert"></p>

<div class="stats" aria-live="polite">
<span>Total: <strong id="count-total">0</strong></span>
<span>Done: <strong id="count-done">0</strong></span>
<span>Left: <strong id="count-left">0</strong></span>
</div>
<div class="filters" role="group" aria-label="Filter tasks">
<button type="button" data-filter="all" aria-pressed="true">All</button>
<button type="button" data-filter="active" aria-pressed="false">To do</button>
<button type="button" data-filter="done" aria-pressed="false">Completed</button>
</div>
<ul id="task-list"></ul>
<p><button type="button" class="btn ghost" id="clear-done">Clear completed</button></p>
</div></section>

</main>
